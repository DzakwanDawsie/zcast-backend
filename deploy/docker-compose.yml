services:
  zcast-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: zcast-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - ../.env
    volumes:
      - zcast-public:/app/public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  zcast-public:
